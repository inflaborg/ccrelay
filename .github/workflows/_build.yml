name: Build (reusable)

on:
  workflow_call:
    inputs:
      build_targets:
        type: string
        default: 'all'
      suffix:
        type: string
        default: ''
      is_prod:
        type: boolean
        default: false
      create_release:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: true
      tag_name:
        type: string
        default: ''
      release_name:
        type: string
        default: ''
      retention_days:
        type: number
        default: 30
      channel:
        description: 'Update channel for Electron auto-update feed (dev or prod)'
        type: string
        default: 'dev'
    secrets:
      APPLE_CSC_LINK:
        required: false
      APPLE_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      OPEN_VSX_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      want_any_build: ${{ steps.targets.outputs.want_any_build }}
      want_build_vscode: ${{ steps.targets.outputs.want_build_vscode }}
      want_build_desktop: ${{ steps.targets.outputs.want_build_desktop }}
      # Tauri CI builds disabled — package code kept under packages/desktop-tauri
      # want_build_tauri: ${{ steps.targets.outputs.want_build_tauri }}
      desktop_matrix: ${{ steps.targets.outputs.desktop_matrix }}
      # tauri_matrix: ${{ steps.targets.outputs.tauri_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION=$(node -p "require('./packages/vscode/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "prod" ]; then
            echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved app_version for channel=${CHANNEL}"

      - name: Resolve build targets & desktop matrix JSON
        id: targets
        env:
          TARGET: ${{ inputs.build_targets || 'all' }}
        run: |
          set -euo pipefail
          MATRIX='[{"os":"macos-latest","platform":"mac","arch":"x64"},{"os":"macos-latest","platform":"mac","arch":"arm64"},{"os":"windows-latest","platform":"win","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"arm64"}]'
          MATRIX_MAC='[{"os":"macos-latest","platform":"mac","arch":"x64"},{"os":"macos-latest","platform":"mac","arch":"arm64"}]'
          MATRIX_WIN='[{"os":"windows-latest","platform":"win","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"arm64"}]'
          MATRIX_MAC_X64='[{"os":"macos-latest","platform":"mac","arch":"x64"}]'
          MATRIX_MAC_ARM64='[{"os":"macos-latest","platform":"mac","arch":"arm64"}]'
          MATRIX_WIN_X64='[{"os":"windows-latest","platform":"win","arch":"x64"}]'
          MATRIX_WIN_ARM64='[{"os":"windows-latest","platform":"win","arch":"arm64"}]'

          # Tauri CI builds disabled — keep matrices for easy re-enable later
          # TAURI_MATRIX='[{"os":"macos-latest","platform":"mac","arch":"arm64","rust_target":"aarch64-apple-darwin"},{"os":"windows-latest","platform":"win","arch":"x64","rust_target":"x86_64-pc-windows-msvc"}]'
          # TAURI_MAC='[{"os":"macos-latest","platform":"mac","arch":"arm64","rust_target":"aarch64-apple-darwin"}]'
          # TAURI_WIN='[{"os":"windows-latest","platform":"win","arch":"x64","rust_target":"x86_64-pc-windows-msvc"}]'
          # TAURI_MAC_ARM64='[{"os":"macos-latest","platform":"mac","arch":"arm64","rust_target":"aarch64-apple-darwin"}]'
          # TAURI_WIN_X64='[{"os":"windows-latest","platform":"win","arch":"x64","rust_target":"x86_64-pc-windows-msvc"}]'

          WANT_V=false
          WANT_D=false
          # WANT_T=false
          DESKTOP_MATRIX='[]'
          # TAURI_TARGETS='[]'

          apply_target() {
            local t="$1"
            case "$t" in
              all)
                WANT_V=true
                WANT_D=true
                # WANT_T=true
                DESKTOP_MATRIX="$MATRIX"
                # TAURI_TARGETS="$TAURI_MATRIX"
                ;;
              vscode)
                WANT_V=true
                ;;
              desktop)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX"
                ;;
              desktop-mac)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_MAC"
                ;;
              desktop-win)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_WIN"
                ;;
              desktop-mac-x64)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_MAC_X64"
                ;;
              desktop-mac-arm64)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_MAC_ARM64"
                ;;
              desktop-win-x64)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_WIN_X64"
                ;;
              desktop-win-arm64)
                WANT_D=true
                DESKTOP_MATRIX="$MATRIX_WIN_ARM64"
                ;;
              # Tauri targets disabled in CI — packages/desktop-tauri code retained
              # tauri)
              #   WANT_T=true
              #   TAURI_TARGETS="$TAURI_MATRIX"
              #   ;;
              # tauri-mac)
              #   WANT_T=true
              #   TAURI_TARGETS="$TAURI_MAC"
              #   ;;
              # tauri-win)
              #   WANT_T=true
              #   TAURI_TARGETS="$TAURI_WIN"
              #   ;;
              # tauri-mac-arm64)
              #   WANT_T=true
              #   TAURI_TARGETS="$TAURI_MAC_ARM64"
              #   ;;
              # tauri-win-x64)
              #   WANT_T=true
              #   TAURI_TARGETS="$TAURI_WIN_X64"
              #   ;;
              tauri|tauri-mac|tauri-win|tauri-mac-arm64|tauri-win-x64)
                echo "Tauri CI builds are disabled; ignoring target: $t" >&2
                ;;
              none)
                ;;
              *)
                echo "Unknown build_targets token: $t" >&2
                exit 1
                ;;
            esac
          }

          NORMALIZED_TARGET="${TARGET// /}"
          if [ -z "$NORMALIZED_TARGET" ] || [ "$NORMALIZED_TARGET" = "none" ]; then
            :
          else
            IFS=',' read -ra TOKENS <<< "$NORMALIZED_TARGET"
            for token in "${TOKENS[@]}"; do
              if [ -n "$token" ]; then
                apply_target "$token"
              fi
            done
          fi

          if [ "$WANT_V" = true ] || [ "$WANT_D" = true ]; then
            echo "want_any_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "want_any_build=false" >> "$GITHUB_OUTPUT"
          fi

          echo "want_build_vscode=$WANT_V" >> "$GITHUB_OUTPUT"
          echo "want_build_desktop=$WANT_D" >> "$GITHUB_OUTPUT"
          # echo "want_build_tauri=$WANT_T" >> "$GITHUB_OUTPUT"
          {
            echo "desktop_matrix<<__MATRIX_EOF__"
            echo "$DESKTOP_MATRIX"
            echo "__MATRIX_EOF__"
          } >> "$GITHUB_OUTPUT"
          # {
          #   echo "tauri_matrix<<__TAURI_MATRIX_EOF__"
          #   echo "$TAURI_TARGETS"
          #   echo "__TAURI_MATRIX_EOF__"
          # } >> "$GITHUB_OUTPUT"

  build-vscode:
    runs-on: ubuntu-latest
    needs: configure
    if: ${{ needs.configure.outputs.want_build_vscode == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run ${{ inputs.is_prod && 'package:prod' || 'package:dev' }}

      - name: Rename vsix file
        if: ${{ inputs.suffix != '' }}
        run: |
          SUFFIX="${{ inputs.suffix }}"
          cd dists
          for file in *.vsix; do
            BASENAME="${file%.vsix}"
            mv "$file" "${BASENAME}${SUFFIX}.vsix"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccrelay-vscode-${{ inputs.is_prod && 'prod' || 'dev' }}-${{ needs.configure.outputs.version }}${{ inputs.suffix }}
          path: dists/*.vsix
          retention-days: ${{ inputs.retention_days }}

  build-desktop:
    needs: configure
    if: ${{ needs.configure.outputs.want_build_desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json', 'packages/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Apply build version
        run: node scripts/set-build-version.mjs --version "${{ needs.configure.outputs.app_version }}"

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3 --arch ${{ matrix.arch }}
        working-directory: packages/desktop

      - name: Build desktop
        run: npm run desktop:build

      - name: Import signing certificate
        id: mac_signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No APPLE_CSC_LINK secret — skipping signing certificate import"
            exit 0
          fi
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(openssl rand -base64 16)"
          P12_FILE="$RUNNER_TEMP/cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$P12_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$P12_FILE"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Pack desktop (${{ matrix.platform }} ${{ matrix.arch }})
        # Avoid -c.publish.url=… CLI overrides: Windows PowerShell/yargs treat -c as
        # --config <file> and try to open a path like .publish.url=https:\….
        # Bake the channel feed into package.json instead (same pattern as version).
        shell: bash
        working-directory: packages/desktop
        env:
          PUBLISH_URL: https://github.com/${{ github.repository }}/releases/download/channel-${{ inputs.channel }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # Pin channel to "latest" so app-update.yml requests latest-mac.yml /
          # latest.yml. Without this, electron-builder derives the channel from
          # the version prerelease (e.g. 0.2.9-dev.N → "dev") and the client
          # looks for missing files like dev-mac.yml. Feed separation is already
          # handled by distinct channel-* publish URLs.
          node -e "
            const fs = require('fs');
            const p = 'package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.build = pkg.build || {};
            pkg.build.publish = {
              provider: 'generic',
              url: process.env.PUBLISH_URL,
              channel: 'latest',
            };
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('publish.url =', pkg.build.publish.url, 'channel =', pkg.build.publish.channel);
          "
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify macOS DMG, ZIP and code signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/desktop/dist/*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No .dmg found in packages/desktop/dist"
            exit 1
          fi
          for dmg in "${files[@]}"; do
            size=$(stat -f%z "$dmg" 2>/dev/null || stat --printf="%s" "$dmg" 2>/dev/null)
            if [[ "$size" -lt 1048576 ]]; then
              echo "::error::$dmg is too small (${size} bytes) — likely corrupt"
              exit 1
            fi
            filetype=$(file "$dmg")
            if [[ "$filetype" != *"bzip2"* && "$filetype" != *"zlib"* && "$filetype" != *"UDIF"* && "$filetype" != *"Apple"* ]]; then
              echo "::error::$dmg is not a valid disk image: $filetype"
              exit 1
            fi
            echo "OK: $dmg (${size} bytes) — $filetype"
            hdiutil verify "$dmg"
          done
          zips=(packages/desktop/dist/*.zip)
          if [[ ${#zips[@]} -eq 0 ]]; then
            echo "::error::No .zip found in packages/desktop/dist (required for auto-update)"
            exit 1
          fi
          for zipf in "${zips[@]}"; do
            size=$(stat -f%z "$zipf" 2>/dev/null || stat --printf="%s" "$zipf" 2>/dev/null)
            if [[ "$size" -lt 1048576 ]]; then
              echo "::error::$zipf is too small (${size} bytes) — likely corrupt"
              exit 1
            fi
            echo "OK: $zipf (${size} bytes)"
          done
          if [[ "${{ steps.mac_signing.outputs.signed }}" == "true" ]]; then
            APP=$(find packages/desktop/dist -name '*.app' -maxdepth 3 | head -1)
            if [[ -z "${APP}" ]]; then
              echo "::error::No .app found under packages/desktop/dist"
              exit 1
            fi
            echo "Verifying code signature: $APP"
            codesign --verify --deep --strict "$APP"
            echo "Code signature OK"
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccrelay-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.configure.outputs.version }}${{ inputs.suffix }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          retention-days: ${{ inputs.retention_days }}

      - name: Cleanup signing keychain
        if: matrix.platform == 'mac' && always()
        run: security delete-keychain build.keychain || true

