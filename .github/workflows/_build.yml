  release:
    runs-on: ubuntu-latest
    # build-tauri removed from needs (Tauri CI builds disabled)
    needs: [configure, build-vscode, build-desktop]
    if: >-
      ${{ always()
        && inputs.create_release
        && needs.configure.result == 'success'
        && needs.configure.outputs.want_any_build == 'true'
        && (needs.configure.outputs.want_build_vscode != 'true' || needs.build-vscode.result == 'success')
        && (needs.configure.outputs.want_build_desktop != 'true' || needs.build-desktop.result == 'success')
      }}
    steps:
      # Checkout first: download-artifact after checkout so clean:true does not wipe assets.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | head -50

      - name: Generate updater manifests
        id: manifests
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          node scripts/generate-update-manifests.mjs \
            --assets-dir release-assets \
            --output-dir release-metadata \
            --version "${{ needs.configure.outputs.app_version }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag_name }}"
          shopt -s nullglob
          files=(release-metadata/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
            echo "No Electron manifests generated"
          else
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
            cp release-metadata/* release-assets/
            ls -la release-metadata/
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish channel manifests
        if: steps.manifests.outputs.has_manifests == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          TAG="channel-${CHANNEL}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${GITHUB_SHA}" \
              --title "Update channel: ${CHANNEL}" \
              --notes "Rolling auto-update manifests for the ${CHANNEL} channel. Not a downloadable build."
          fi
          gh release upload "$TAG" release-metadata/* --clobber
          # Older/dev builds whose version prerelease is "dev" (e.g. 0.2.9-dev.N)
          # still request ${CHANNEL}-mac.yml / ${CHANNEL}.yml. Mirror latest-* so
          # those clients keep updating until they pick up channel: latest builds.
          if [[ "$CHANNEL" != "prod" && "$CHANNEL" != "latest" ]]; then
            mkdir -p release-metadata-aliases
            [[ -f release-metadata/latest-mac.yml ]] && cp release-metadata/latest-mac.yml "release-metadata-aliases/${CHANNEL}-mac.yml"
            [[ -f release-metadata/latest.yml ]] && cp release-metadata/latest.yml "release-metadata-aliases/${CHANNEL}.yml"
            shopt -s nullglob
            aliases=(release-metadata-aliases/*)
            if [[ ${#aliases[@]} -gt 0 ]]; then
              gh release upload "$TAG" "${aliases[@]}" --clobber
            fi
          fi

  publish-openvsx:
    runs-on: ubuntu-latest
    needs: [configure, build-vscode, release]
    if: >-
      ${{ always()
        && inputs.is_prod
        && inputs.create_release
        && needs.configure.result == 'success'
        && needs.configure.outputs.want_build_vscode == 'true'
        && needs.build-vscode.result == 'success'
        && needs.release.result == 'success'
      }}
    steps:
      - name: Download vsix artifact
        uses: actions/download-artifact@v4
        with:
          name: ccrelay-vscode-prod-${{ needs.configure.outputs.version }}${{ inputs.suffix }}
          path: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT}" ]; then
            echo "OPEN_VSX_TOKEN not configured — skipping Open VSX publish"
            exit 0
          fi
          shopt -s nullglob
          files=(vsix/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .vsix file found in artifact"
            exit 1
          fi
          npx ovsx publish "${files[0]}" -p "$OVSX_PAT"
